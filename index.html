<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Taberna</title>
<style>
:root{--bg:#14151a;--bg2:#1c1e26;--bg3:#272a36;--fg:#e8e9ee;--dim:#9a9eb0;--acc:#8b7cf6;--acc2:#6f61d9;--red:#e5646e;--ok:#5fc98b;--q:#f0c987;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid #343848;border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none;line-height:1.4}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
small{color:var(--dim)}
b{font-weight:600}
#main{flex:1;overflow-y:auto;min-height:0}
#nav{display:flex;background:var(--bg2);border-top:1px solid #2c2f3c;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button span{font-size:19px;line-height:1.1}
#nav button.on{color:var(--acc)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);position:sticky;top:0;z-index:2;min-height:52px}
.bar .ttl{flex:1;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ttl small{display:block;font-weight:400;font-size:12px}
.ic{background:none;border:0;font-size:22px;padding:2px 8px;color:var(--fg)}
.list{padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:var(--r);padding:10px 12px}
.row .grow{flex:1;min-width:0}
.row .grow *{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--acc)}
.av img{width:100%;height:100%;object-fit:cover}
.card{background:var(--bg2);border-radius:var(--r);padding:12px;margin:0 12px 10px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12px;color:var(--dim)}
.tg{display:flex;align-items:center;gap:10px}
.tg span{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--bg3);border:1px solid #343848;border-radius:10px;padding:8px 12px;color:var(--fg)}
.btn.pri{background:var(--acc2);border-color:var(--acc2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5}
.chip{font-size:11px;background:var(--bg3);color:var(--dim);border-radius:20px;padding:1px 8px;white-space:nowrap}
.chip.a{color:var(--acc)}
.empty{color:var(--dim);text-align:center;padding:40px 24px}
.back{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);width:100%;max-height:88dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.full{height:92dvh}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.sh-h .x{background:none;border:0;font-size:18px;color:var(--dim);padding:4px 8px}
.sh-b{overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.screen{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sc-b{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px}
.screen .card{margin:0 12px 10px}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:94%;border-radius:16px;padding:9px 12px;position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot{background:var(--bg2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:#2d2a52;align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:12px;color:var(--acc);font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.msg .who img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.msg .txt i{color:#b9bdd0}
.msg .txt .q{color:var(--q)}
.msg .acts{display:flex;gap:4px;margin-top:4px;opacity:.55}
.msg .acts button{background:none;border:0;color:var(--dim);font-size:14px;padding:2px 8px}
.msg .rg{display:none}
.msg:last-child .rg{display:inline-block}
.msg.stream .acts{display:none}
.more{align-self:center}
.comp{display:flex;gap:8px;padding:8px 10px;background:var(--bg2);padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:flex-end}
.comp textarea{max-height:140px;min-height:42px;border-radius:20px;padding:10px 14px}
.comp .send{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc2);font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;z-index:50;max-width:90%;text-align:center;font-size:14px}
.ck{display:flex;gap:10px;align-items:flex-start;background:var(--bg3);border-radius:10px;padding:8px 10px}
.ck div{flex:1;font-size:13px}
.entry{background:var(--bg2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.entry .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.entry p{margin:0;font-size:13px;color:#b9bdd0}
.dots{opacity:.6}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"></nav>
<script>
'use strict';
/* ================= util ================= */
function h(tag,a,...kids){const e=document.createElement(tag);let val;
  for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='value')val=v;
    else if(k==='checked')e.checked=true;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));
  if(val!==undefined)e.value=val;return e}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>')
  .replace(/("[^"\n]+"|“[^”\n]+”|«[^»\n]+»)/g,'<span class="q">$1</span>').replace(/\n/g,'<br>')}
function toast(m,ms=2800){const t=h('div',{class:'toast'},m);document.body.append(t);setTimeout(()=>t.remove(),ms)}
function relTime(ts){const d=(Date.now()-ts)/1000;if(d<60)return 'ahora';if(d<3600)return Math.floor(d/60)+' min';if(d<86400)return Math.floor(d/3600)+' h';return new Date(ts).toLocaleDateString('es-CL',{day:'numeric',month:'short'})}
function download(name,text,type='application/json'){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function pickFile(accept,multiple){return new Promise(res=>{const i=h('input',{type:'file',accept,multiple:!!multiple,style:'display:none'});i.onchange=()=>{res([...i.files]);i.remove()};document.body.append(i);i.click()})}
const toKeys=k=>(Array.isArray(k)?k:String(k||'').split(',')).map(s=>String(s).trim()).filter(Boolean);
function parseJSON(t){t=String(t).replace(/```json|```/gi,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1))}catch{return null}}
const field=(label,...c)=>h('label',{class:'fld'},h('span',{},label),...c);
const btn=(t,fn,cls='')=>h('button',{class:'btn '+cls,onclick:fn},t);
const sel=(opts,val,fn)=>h('select',{value:val,onchange:e=>fn(e.target.value)},opts.map(([v,l])=>h('option',{value:v},l)));
const toggle=(label,val,fn)=>h('label',{class:'tg'},h('span',{},label),h('input',{type:'checkbox',checked:val,onchange:e=>fn(e.target.checked)}));
const empty=t=>h('div',{class:'empty'},t);
const av=o=>h('div',{class:'av'},o&&o.avatar?h('img',{src:o.avatar,loading:'lazy'}):(o&&o.name?o.name[0].toUpperCase():'?'));
const sub=(t,c)=>(t||'').replace(/{{\s*char\s*}}/gi,c.char).replace(/{{\s*user\s*}}/gi,c.user);

/* ================= base de datos ================= */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('taberna',1);
    r.onupgradeneeded=()=>{const d=r.result;for(const s of ['characters','personas','lorebooks','chats','presets'])d.createObjectStore(s,{keyPath:'id'});
      d.createObjectStore('kv',{keyPath:'k'});const m=d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
      m.createIndex('chat','chatId');m.createIndex('chatId_id',['chatId','id'])};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  st(s,m='readonly'){return this.db.transaction(s,m).objectStore(s)},
  rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(s){return this.rq(this.st(s).getAll())},
  get(s,k){return this.rq(this.st(s).get(k))},
  put(s,v){return this.rq(this.st(s,'readwrite').put(v))},
  del(s,k){return this.rq(this.st(s,'readwrite').delete(k))},
  clear(s){return this.rq(this.st(s,'readwrite').clear())},
  /* mensajes ascendentes de un chat, leídos desde el final (solo lo necesario) */
  msgs(chatId,{afterId=0,beforeId=Infinity,limit=Infinity,maxChars=Infinity}={}){
    return new Promise((res,rej)=>{const out=[];let chars=0;
      const r=this.st('messages').index('chatId_id').openCursor(IDBKeyRange.bound([chatId,afterId+1],[chatId,beforeId],false,true),'prev');
      r.onsuccess=()=>{const c=r.result;if(!c){res(out.reverse());return}
        const m=c.value;if(out.length&&chars+m.content.length>maxChars){res(out.reverse());return}
        out.push(m);chars+=m.content.length;if(out.length>=limit){res(out.reverse());return}c.continue()};
      r.onerror=()=>rej(r.error)})},
  delChat(chatId){return new Promise((res,rej)=>{const r=this.st('messages','readwrite').index('chat').openCursor(IDBKeyRange.only(chatId));
    r.onsuccess=()=>{const c=r.result;if(!c){res();return}c.delete();c.continue()};r.onerror=()=>rej(r.error)})}
};

/* ================= estado ================= */
const KS={chars:'characters',personas:'personas',lores:'lorebooks',presets:'presets',chats:'chats'};
const S={settings:null,chars:new Map(),personas:new Map(),lores:new Map(),presets:new Map(),chats:new Map(),tab:'chats'};
const put=(k,o)=>{S[k].set(o.id,o);return DB.put(KS[k],o)};
const rm=(k,id)=>{S[k].delete(id);return DB.del(KS[k],id)};
const saveSettings=()=>DB.put('kv',{k:'settings',v:S.settings});
const DEF={profiles:[],activeProfile:null,auxProfile:'',dirOn:false,dirProfile:'',dirCtxTokens:30000,dirMaxTokens:4000,dirLang:'story',personaId:null,presetId:null,tone:'',ctxTokens:6000,loreTokens:1200,scanDepth:6,pageSize:30,autoLore:true,autoLoreEvery:4,summarize:true};
const DEFURL={openai:'https://openrouter.ai/api/v1',anthropic:'https://api.anthropic.com',gemini:'https://generativelanguage.googleapis.com'};
const CPT=3.5; /* caracteres por token (aprox.) */
const SEED_PRESETS=[
 {name:'Rol clásico',temperature:0.9,maxTokens:1000,instructions:'Eres {{char}} en un roleplay con {{user}}. Escribe solo la siguiente respuesta de {{char}}; nunca hables, actúes ni decidas por {{user}}. Sé coherente con la ficha, el lore y lo ocurrido. Usa *asteriscos* para acciones y "comillas" para el diálogo. Toma iniciativa y haz avanzar la escena; no repitas frases anteriores. No rompas el personaje ni agregues notas fuera de la ficción.'},
 {name:'Narrador',temperature:0.85,maxTokens:1500,instructions:'Actúa como narrador de una historia interactiva en la que {{user}} es el protagonista. Describe el entorno, los hechos y a los personajes (incluido {{char}}) en tercera persona, con detalle sensorial y ritmo. Nunca decidas las acciones ni los pensamientos de {{user}}. Termina dejando una apertura natural para que {{user}} responda.'},
 {name:'Breve',temperature:0.8,maxTokens:500,instructions:'Eres {{char}}. Responde en 1 a 3 párrafos cortos, directo y en personaje. No hables ni actúes por {{user}}. Acciones en *asteriscos*, diálogo en "comillas".'}];

async function loadAll(){
  for(const k in KS)S[k]=new Map((await DB.all(KS[k])).map(x=>[x.id,x]));
  const kv=await DB.get('kv','settings');S.settings={...DEF,...(kv&&kv.v||{})};
  if(!S.presets.size)for(const p of SEED_PRESETS)await put('presets',{id:uid(),...p});
  if(!S.personas.size)await put('personas',{id:uid(),name:'Tú',description:'',avatar:''});
  if(!S.presets.has(S.settings.presetId))S.settings.presetId=[...S.presets.keys()][0];
  if(!S.personas.has(S.settings.personaId))S.settings.personaId=[...S.personas.keys()][0];
  if(!S.settings.mig2){for(const p of S.presets.values()){const up={'Rol clásico':[600,1000],'Narrador':[900,1500],'Breve':[300,500]}[p.name];if(up&&p.maxTokens===up[0]){p.maxTokens=up[1];await DB.put('presets',p)}}S.settings.mig2=true}
  await saveSettings()}

/* ================= capas (botón atrás de Android) ================= */
const layers=[],backWait=[];
function pushLayer(L){layers.push(L);history.pushState({d:layers.length},'')}
function closeTop(){return new Promise(r=>{backWait.push(r);history.back()})}
addEventListener('popstate',()=>{const L=layers.pop();if(L)L.close();const r=backWait.shift();if(r)r()});
function sheet(title,body,{full=false}={}){
  const back=h('div',{class:'back',onclick:e=>{if(e.target===back)closeTop()}});
  const b=h('div',{class:'sh-b'},body);
  back.append(h('div',{class:'sheet'+(full?' full':'')},h('div',{class:'sh-h'},h('b',{},title),h('button',{class:'x',onclick:closeTop},'✕')),b));
  document.body.append(back);const L={body:b,close(){back.remove()}};pushLayer(L);return L}
function screen(title,{actions=[]}={}){
  const body=h('div',{class:'sc-b'});const ttl=h('div',{class:'ttl'},title);
  const bar=h('div',{class:'bar'},h('button',{class:'ic',onclick:closeTop},'‹'),ttl,...actions);
  const el=h('div',{class:'screen'},bar,body);document.body.append(el);
  const L={el,body,bar,ttl,close(){el.remove();if(L.onClose)L.onClose()}};pushLayer(L);return L}

/* ================= LLM ================= */
const base=p=>(p.baseUrl||DEFURL[p.kind]).replace(/\/+$/,'');
const mainProfile=()=>S.settings.profiles.find(p=>p.id===S.settings.activeProfile)||S.settings.profiles[0];
const dirProfile=()=>S.settings.profiles.find(p=>p.id===S.settings.dirProfile)||null;
const auxProfile=()=>S.settings.profiles.find(p=>p.id===S.settings.auxProfile)||(S.settings.dirOn&&dirProfile())||mainProfile();
function mergeRoles(msgs,first='user'){const out=[];for(const m of msgs){const r=m.role;if(out.length&&out[out.length-1].role===r)out[out.length-1].content+='\n\n'+m.content;else out.push({role:r,content:m.content})}
  if(out.length&&out[0].role!==first)out.unshift({role:first,content:'(Inicio de la conversación)'});return out}
const VERSION='2026-10-23-f';
const SW_CACHE='taberna-v1';
async function readSSE(resp,onData){const rd=resp.body.getReader(),dec=new TextDecoder();let buf='',all='',n=0;
  const line=l=>{l=l.replace(/\r$/,'');if(l.startsWith('data:')){const d=l.slice(5).trim();if(d&&d!=='[DONE]'){n++;onData(d)}}};
  for(;;){const{done,value}=await rd.read();if(done)break;const chunk=dec.decode(value,{stream:true});all+=chunk;buf+=chunk;
    let i;while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i));buf=buf.slice(i+1)}}
  buf+=dec.decode();if(buf)line(buf);return{raw:all,events:n}}
const plain=j=>{const c0=j.choices&&j.choices[0];
  if(c0){const m=c0.message&&c0.message.content;if(typeof m==='string')return m;if(Array.isArray(m))return m.map(x=>x.text||'').join('');return c0.text||''}
  if(Array.isArray(j.content))return j.content.map(x=>x.text||'').join('');
  const cd=j.candidates&&j.candidates[0];if(cd&&cd.content)return(cd.content.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('');
  return''};
async function llm(p,{system,messages,temperature=0.8,maxTokens=800,signal,onToken,info}){
  if(!p)throw new Error('Configura una conexión en Ajustes');
  if(p.noSystem&&p.kind!=='anthropic'&&system){messages=[...messages];
    if(messages[0]&&messages[0].role==='user')messages[0]={role:'user',content:system+'\n\n---\n\n'+messages[0].content};else messages.unshift({role:'user',content:system});system=''}
  const hd={'Content-Type':'application/json'};
  if(p.kind==='anthropic'){hd['x-api-key']=p.key;hd['anthropic-version']='2023-06-01';hd['anthropic-dangerous-direct-browser-access']='true'}
  else if(p.kind!=='gemini'&&p.key)hd.Authorization='Bearer '+p.key;
  const mk=stream=>{
    if(p.kind==='anthropic')return{url:base(p)+'/v1/messages',
      body:{model:p.model,system,messages:mergeRoles(messages),max_tokens:maxTokens,temperature:Math.min(temperature,1),stream},
      pick:j=>j.type==='content_block_delta'&&j.delta&&j.delta.text||''};
    if(p.kind==='gemini')return{url:`${base(p)}/v1beta/models/${p.model}:${stream?'streamGenerateContent?alt=sse&':'generateContent?'}key=${encodeURIComponent(p.key)}`,
      body:{...(system?{systemInstruction:{parts:[{text:system}]}}:{}),contents:mergeRoles(messages.map(m=>({role:m.role==='assistant'?'model':'user',content:m.content})),'user').map(m=>({role:m.role,parts:[{text:m.content}]})),
        generationConfig:{temperature,maxOutputTokens:maxTokens},
        safetySettings:['HARASSMENT','HATE_SPEECH','SEXUALLY_EXPLICIT','DANGEROUS_CONTENT'].map(c=>({category:'HARM_CATEGORY_'+c,threshold:'BLOCK_NONE'}))},
      pick:plain};
    return{url:base(p)+'/chat/completions',
      body:{model:p.model,messages:[...(system?[{role:'system',content:system}]:[]),...messages],temperature,max_tokens:maxTokens,stream},
      pick:j=>j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content||''}};
  const call=async stream=>{const{url,body,pick}=mk(stream);
    const r=await fetch(url,{method:'POST',headers:hd,body:JSON.stringify(body),signal});
    if(!r.ok){let t='';try{t=await r.text()}catch{}throw new Error(r.status+': '+t.slice(0,240))}
    return{r,pick}};
  let out='',think=0,fin='',errMsg='',raw='',events=0;
  const eat=j=>{
    if(j.error)errMsg=typeof j.error==='string'?j.error:(j.error.message||JSON.stringify(j.error));
    const ch=j.choices&&j.choices[0];if(ch){if(ch.finish_reason)fin=ch.finish_reason;const dl=ch.delta||ch.message||{};think+=String(dl.reasoning_content||dl.reasoning||'').length}
    const cd=j.candidates&&j.candidates[0];if(cd&&cd.finishReason)fin=cd.finishReason;
    if(j.promptFeedback&&j.promptFeedback.blockReason)fin='bloqueado: '+j.promptFeedback.blockReason;
    if(j.type==='message_delta'&&j.delta&&j.delta.stop_reason)fin=j.delta.stop_reason;
    if(j.stop_reason)fin=j.stop_reason};
  {const{r,pick}=await call(true);
    const res=await readSSE(r,d=>{let j;try{j=JSON.parse(d)}catch{return}eat(j);const t=pick(j);if(t){out+=t;if(onToken)onToken(out)}});
    raw=res.raw;events=res.events}
  /* el proveedor ignoró el streaming y devolvió JSON plano */
  if(!out.trim()&&!errMsg&&raw.trim()&&!events){try{const j=JSON.parse(raw);eat(j);out=plain(j);if(out&&onToken)onToken(out)}catch{}}
  /* sigue vacío: un reintento sin streaming */
  if(!out.trim()&&!errMsg&&!think&&!(events&&fin)){
    try{const{r}=await call(false);const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{}
      if(j){eat(j);out=plain(j);if(out&&onToken)onToken(out)}if(!raw)raw=txt||''}
    catch(e){if(e.name==='AbortError')throw e;errMsg=errMsg||e.message}}
  if(!out.trim()){
    if(errMsg)throw new Error(errMsg);
    if(think&&(!fin||/length|max_tokens/i.test(fin)))throw new Error('El modelo gastó todos los tokens razonando y no escribió nada. Sube el límite de tokens (director: en Ajustes; escritor: en el preset).');

async function buildPrompt(chat,upToId=Infinity,{role='single',brief=''}={}){

  const preset=S.presets.get(chat.presetId)||S.presets.get(st.presetId)||[...S.presets.values()][0];
  const dir=role==='director',wr=role==='writer';
  const budget=(dir?st.dirCtxTokens:st.ctxTokens)*CPT;
  let hist=await DB.msgs(chat.id,{afterId:chat.summaryUpTo||0,beforeId:upToId,maxChars:budget});
  const scan=hist.slice(-st.scanDepth).map(m=>m.content).join('\n');
  const lore=wr?[]:activeLore(ch,scan+'\n'+(ch.name||''),dir?2:1);
  const tone=(chat.tone||st.tone||'').trim();const P=[];
  if(dir)P.push(sub(DIRECTOR_SYS.replace('{{lang}}',DIRLANG[st.dirLang]||DIRLANG.story),c));
  P.push((dir?'# Guía de estilo que seguirá el escritor\n':'')+sub(preset.instructions,c));
  if(tone)P.push('# Tono y estilo\n'+sub(tone,c));
  if(ch.system_prompt)P.push(sub(ch.system_prompt,c));
  P.push('# Personaje: '+ch.name+'\n'+[ch.description,ch.personality&&'Personalidad: '+ch.personality,ch.scenario&&'Escenario: '+ch.scenario].filter(Boolean).map(t=>sub(t,c)).join('\n'));
  if(per.description)P.push('# Usuario: '+per.name+'\n'+sub(per.description,c));
  if(ch.mes_example&&!dir)P.push('# Ejemplos de diálogo\n'+sub(ch.mes_example,c));
  if(lore.length)P.push('# Información del mundo (lore relevante)\n'+lore.map(e=>(e.name?'['+e.name+'] ':'')+sub(e.content,c)).join('\n'));
  if(chat.summary&&!wr)P.push('# Resumen de lo ocurrido antes\n'+chat.summary);
  if(wr&&brief)P.push('# Notas del director (privadas: guían tu respuesta; no las menciones ni las cites)\n'+brief);
  const system=P.join('\n\n');
  let total=hist.reduce((n,m)=>n+m.content.length,0);const room=Math.max(budget-system.length,1500);
  while(hist.length>2&&total>room){total-=hist[0].content.length;hist.shift()}
  const turns=hist.map(m=>({role:m.role,content:sub(m.content,c)}));
  if(dir)return{system,preset,messages:[{role:'user',content:'# Conversación reciente\n'+turns.map(m=>(m.role==='user'?c.user:c.char)+': '+m.content).join('\n\n')+'\n\n# Tarea\nEscribe ahora las notas para la siguiente respuesta de '+c.char+'.'}]};
  return{system,messages:turns,preset}}

async function updateLore(chat,force){

  try{
    const msgs=await DB.msgs(chat.id,{afterId:chat.lastLoreId||0,limit:24,maxChars:14000});
    if(!msgs.length){if(force)toast('No hay mensajes nuevos que analizar');return}
    const existing=lb.entries.slice(-80).map(e=>`[${e.id}] ${e.name||''} | claves: ${e.keys.join(', ')} | ${e.content.slice(0,220)}`).join('\n')||'(vacío)';
    const convo=msgs.map(m=>`${m.role==='user'?c.user:c.char}: ${sub(m.content,c)}`).join('\n\n');
    const raw=await llm(auxProfile(),{system:LORE_SYS(c.char),messages:[{role:'user',content:`Entradas existentes:\n${existing}\n\nConversación reciente:\n${convo}`}],temperature:0.3,maxTokens:1400});
    const j=parseJSON(raw);if(!j)throw new Error('El modelo no devolvió JSON válido');

      else if(o.op==='update'&&o.content){const e=lb.entries.find(x=>x.id===o.id);if(e){changes.push({op:'update',id:e.id,prev:{...e,keys:[...e.keys]}});e.content=String(o.content);if(o.keys&&o.keys.length)e.keys=[...new Set([...e.keys,...toKeys(o.keys)])];u++}}}

function pngText(buf){const u=new Uint8Array(buf),v=new DataView(buf);const sig=[137,80,78,71,13,10,26,10];for(let i=0;i<8;i++)if(u[i]!==sig[i])return null;

  while(p+8<=u.length){const len=v.getUint32(p),type=String.fromCharCode(u[p+4],u[p+5],u[p+6],u[p+7]),s=p+8,e=s+len;
    if(type==='tEXt'||type==='iTXt'){let z=s;while(z<e&&u[z]!==0)z++;const key=L.decode(u.subarray(s,z));let tx;
      if(type==='tEXt')tx=L.decode(u.subarray(z+1,e));else{let q=z+3,n=0;while(n<2&&q<e){if(u[q]===0)n++;q++}tx=U.decode(u.subarray(q,e))}
      out[key]=tx}
    if(type==='IEND')break;p=e+4}
  return out}

function resizeImg(src,max=320){return new Promise((res,rej)=>{const url=src instanceof Blob?URL.createObjectURL(src):src;const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(src instanceof Blob)URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>rej(new Error('Imagen no válida'));img.src=url})}

  return arr.map(e=>({id:uid(),name:String(e.name||e.comment||''),keys:toKeys(e.keys||e.key),content:String(e.content||''),

/* ---- ZIP (descargas múltiples) ---- */
async function unzip(buf){
  const u=new Uint8Array(buf),v=new DataView(buf);let e=u.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('ZIP no válido');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)break;
    const flags=v.getUint16(p+8,true),method=v.getUint16(p+10,true),csize=v.getUint32(p+20,true),nlen=v.getUint16(p+28,true),xlen=v.getUint16(p+30,true),clen=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=new TextDecoder(flags&0x800?'utf-8':'latin1').decode(u.subarray(p+46,p+46+nlen));p+=46+nlen+xlen+clen;
    if(name.endsWith('/'))continue;
    const ds=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true);
    out.push({name,method,data:u.subarray(ds,ds+csize)})}
  return out}

  if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede abrir ZIP; descomprímelo antes');
  const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(data);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function importAny(file){
  if(/\.zip$/i.test(file.name)||/zip/.test(file.type||'')){
    let ents;try{ents=await unzip(await file.arrayBuffer())}catch(e){toast(file.name+': '+e.message,4000);return 0}
    let n=0;
    for(const en of ents){const nm=en.name.split('/').pop();if(!/\.(png|json)$/i.test(nm)||nm.startsWith('._'))continue;
      try{const bytes=en.method===0?en.data:await inflate(en.data);
        const f=/\.png$/i.test(nm)?new File([bytes],nm,{type:'image/png'}):{name:nm,type:'application/json',text:async()=>new TextDecoder().decode(bytes)};
        await importCard(f);n++}catch(e){toast(nm+': '+e.message,3500)}}
    return n}
  try{await importCard(file);return 1}catch(e){toast(file.name+': '+e.message,4000);return 0}}

    if(acc){m.content=acc;if(brief)m.brief=brief;else delete m.brief;const k=await DB.put('messages',m);m.id=k;chat.updated=Date.now();await put('chats',chat);const n=msgEl(m);el.replaceWith(n);trimDom();if(!regen)afterTurn(chat)}
    else{if(regen){m.content=old;el.replaceWith(msgEl(m))}else el.remove()}
    busy=false;setBtn();if(near())stick()}
  async function doSend(){
    if(busy){ac&&ac.abort();return}
    const t=ta.value.trim();
    if(t){const m={chatId:chat.id,role:'user',content:t,ts:Date.now()};m.id=await DB.put('messages',m);ta.value='';ta.style.height='';list.append(msgEl(m));stick()}
    else{const last=list.querySelector('.msg:last-child');if(!last||last._m.role==='assistant')return}
    generate()}
  send.onclick=doSend;ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'};
  (async()=>{const ms=await DB.msgs(chat.id,{limit:S.settings.pageSize+1});hasMore=ms.length>S.settings.pageSize;if(hasMore)ms.shift();
    for(const m of ms)list.append(msgEl(m));oldest=ms.length?ms[0].id:null;updMore();stick()})();
  L.onClose=()=>{ac&&ac.abort();if(S.tab==='chats')R.chats()}}

function editProfile(src){const isNew=!src;const p=src?{...src}:{id:uid(),name:'',kind:'openai',baseUrl:'',key:'',model:''};
  const name=h('input',{value:p.name,placeholder:'Ej.: OpenRouter'});const url=h('input',{value:p.baseUrl,placeholder:DEFURL[p.kind],type:'url'});const key=h('input',{value:p.key,type:'password',placeholder:'API key'});
  const model=h('input',{value:p.model,placeholder:'modelo',list:'mdl'});const dl=h('datalist',{id:'mdl'});
  const kind=sel([['openai','Compatible con OpenAI (OpenRouter, DeepSeek, OpenAI, local…)'],['anthropic','Anthropic (Claude)'],['gemini','Google Gemini']],p.kind,v=>{p.kind=v;url.placeholder=DEFURL[v]});

  sheet(isNew?'Nueva conexión':'Editar conexión',[field('Nombre',name),field('Tipo',kind),field('URL base (vacío = predeterminada)',url),field('API key',key),field('Modelo',model,dl),toggle('Sin rol "system": fusionar las instrucciones en el primer mensaje (actívalo si el modelo da error con las instrucciones de sistema, como pasa con algunos Gemma)',ns,v=>ns=v),
